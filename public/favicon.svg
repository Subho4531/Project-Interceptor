<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- Background disc -->
  <rect width="128" height="128" rx="20" fill="#0B0B0B"/>
  
  <!-- Outer Crosshair Extensions -->
  <line x1="64" y1="12" x2="64" y2="28" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="square"/>
  <line x1="64" y1="100" x2="64" y2="116" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="square"/>
  <line x1="12" y1="64" x2="28" y2="64" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="square"/>
  <line x1="100" y1="64" x2="116" y2="64" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="square"/>

  <!-- Radar Rings -->
  <!-- Outer Primary Reticle Ring -->
  <circle cx="64" cy="64" r="46" stroke="#FFFFFF" stroke-width="1.8"/>
  <!-- Secondary Fine Ring -->
  <circle cx="64" cy="64" r="43" stroke="#FFFFFF" stroke-width="0.8" stroke-opacity="0.4"/>
  <!-- Subdued Cyan Range Ring -->
  <circle cx="64" cy="64" r="39.5" stroke="#00E5FF" stroke-width="1.2" stroke-opacity="0.85"/>
  <!-- Tactical Amber Azimuth Ring -->
  <circle cx="64" cy="64" r="36" stroke="#F59E0B" stroke-width="0.9" stroke-dasharray="4 3" stroke-opacity="0.75"/>
  <!-- Inner Tracking Ring -->
  <circle cx="64" cy="64" r="28" stroke="#FFFFFF" stroke-width="0.6" stroke-opacity="0.35"/>

  <!-- Center Fine Crosshairs -->
  <line x1="64" y1="34" x2="64" y2="94" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.6"/>
  <line x1="34" y1="64" x2="94" y2="64" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.6"/>

  <!-- Center Target Reticle -->
  <circle cx="64" cy="64" r="4.5" stroke="#F59E0B" stroke-width="1.5" fill="#0B0B0B"/>
  <circle cx="64" cy="64" r="1.5" fill="#00E5FF"/>

  <!-- Stealth UAV Delta Wing Airframe -->
  <g id="uav-airframe">
    <!-- Main Wing Body -->
    <path d="M 64 34
             L 72 48
             L 94 85
             L 86 91
             L 76 76
             L 64 88
             L 52 76
             L 42 91
             L 34 85
             L 56 48
             Z"
          fill="#FFFFFF"
          stroke="#0B0B0B"
          stroke-width="1.5"
          stroke-linejoin="round"/>

    <!-- Left Wing Facet Shading -->
    <path d="M 64 34
             L 56 48
             L 42 91
             L 52 76
             L 64 88
             Z"
          fill="#ECEFF1"
          opacity="0.95"/>

    <!-- Right Wing Facet Shading -->
    <path d="M 64 34
             L 72 48
             L 94 85
             L 86 91
             L 76 76
             L 64 88
             Z"
          fill="#FFFFFF"/>

    <!-- Inner Stealth Chine / Spine Ridge -->
    <path d="M 64 37
             L 68 50
             L 64 74
             L 60 50
             Z"
          fill="#0B0B0B"
          opacity="0.88"/>

    <!-- Center Spine Highlight -->
    <line x1="64" y1="37" x2="64" y2="74" stroke="#00E5FF" stroke-width="1"/>

    <!-- Trailing Intake Notches -->
    <polygon points="61,72 64,68 67,72 64,78" fill="#F59E0B" opacity="0.9"/>
  </g>
</svg>
