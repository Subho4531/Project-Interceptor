[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "project-interceptor-companion"
version = "0.1.0"
description = "Simulation telemetry validator, scoring test harness, and companion tools for Drone Threat Simulation Trainer"
authors = [{ name = "Project Interceptor Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6.0",
    "jsonschema>=4.21.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pytest>=8.0.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.3.0",
    "pytest-asyncio>=0.23.0",
]
